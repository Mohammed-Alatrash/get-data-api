<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page">
  <a class="back" href="index.html">Back to catalogue</a>
  <div id="view" aria-live="polite"><div class="loader" role="progressbar" aria-label="Loading"></div></div>
</main>

<script src="common.js"></script>
<script>
const API = 'https://dummyjson.com/products';
const id = new URLSearchParams(location.search).get('id');

function showMsg(text, retry) {
  $('view').innerHTML = `<p id="msg">${esc(text)}${retry ? ' <button type="button">Try again</button>' : ''}</p>`;
  if (retry) $('msg').querySelector('button').onclick = retry;
}

function render(p) {
  document.title = p.title + ' | Catalogue';
  const imgs = p.images && p.images.length ? p.images : [p.thumbnail];
  const rows = [
    ['Availability', p.availabilityStatus],
    ['In stock', p.stock],
    ['Shipping', p.shippingInformation],
    ['Warranty', p.warrantyInformation],
    ['Return policy', p.returnPolicy],
    ['Minimum order', p.minimumOrderQuantity]
  ].filter(([, v]) => v != null && v !== '');

  $('view').innerHTML = `
    <section class="detail">
      <div class="gallery">
        <div class="pic"><img id="main" src="${esc(imgs[0])}" alt="${esc(p.title)}" width="600" height="600"></div>
        ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((s, i) =>
          `<button type="button" aria-pressed="${i === 0}" aria-label="Show image ${i + 1}" data-src="${esc(s)}"><img src="${esc(s)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
      </div>
      <div>
        <p class="cat">${esc(p.category.replace(/-/g, ' '))}</p>
        <h1>${esc(p.title)}</h1>
        ${p.brand ? `<p class="brand">${esc(p.brand)}</p>` : ''}
        <div class="buy">
          <span class="price">$${p.price.toFixed(2)}</span>
          ${p.discountPercentage >= 1 ? `<span class="chip">${Math.round(p.discountPercentage)}% off</span>` : ''}
          <span>${p.rating.toFixed(1)} / 5</span>
        </div>
        <p class="lead">${esc(p.description)}</p>
        <dl>${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
      </div>
    </section>`;

  const thumbs = document.querySelector('.thumbs');
  if (thumbs) thumbs.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    $('main').src = b.dataset.src;
    thumbs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
}

async function load() {
  if (!/^\d+$/.test(id || '')) return showMsg('Product not found.');
  $('view').innerHTML = LOADER;
  try {
    render(await getJSON(`${API}/${id}`));
  } catch (e) {
    if (e.status === 404) showMsg('Product not found.');
    else showMsg('Could not load the product.', load);
  }
}

load();
</script>
</body>
</html>
