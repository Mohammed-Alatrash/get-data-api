<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <aside>
    <nav class="cats" aria-label="Categories">
      <h2>Categories</h2>
      <ul id="cats"><li><div class="loader" role="progressbar" aria-label="Loading"></div></li></ul>
    </nav>
  </aside>

  <main>
    <header>
      <h1 id="title">All products</h1>
      <p id="count"></p>
    </header>
    <ul class="grid" id="grid"></ul>
    <p id="msg" role="status"></p>
    <button class="more" id="more" type="button" hidden>Show more</button>
  </main>
</div>

<script src="common.js"></script>
<script>
const API = 'https://dummyjson.com/products';
const LIMIT = 24;

let cat = '';   // slug of the selected category ('' = all)
let skip = 0;   // how many products are already shown
let req = 0;    // id of the latest request, to ignore stale responses

function showError(text, retry) {
  $('msg').innerHTML = esc(text) + ' <button type="button">Try again</button>';
  $('msg').querySelector('button').onclick = retry;
}

/* ---------- Categories ---------- */
async function loadCategories() {
  try {
    const list = await getJSON(API + '/categories');
    const all = [{ slug: '', name: 'All products' }, ...list.map(c =>
      typeof c === 'string' ? { slug: c, name: c.replace(/-/g, ' ') } : c)];
    $('cats').innerHTML = all.map(c =>
      `<li><button type="button" data-slug="${esc(c.slug)}" data-name="${esc(c.name)}" aria-pressed="${c.slug === cat}">${esc(c.name)}</button></li>`
    ).join('');
  } catch {
    $('cats').innerHTML = '<li><button type="button" id="retry-cats">Could not load categories. Try again</button></li>';
    $('retry-cats').onclick = loadCategories;
  }
}

$('cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-slug]');
  if (!b) return;
  cat = b.dataset.slug;
  $('title').textContent = b.dataset.name;
  document.querySelectorAll('#cats button').forEach(x => x.setAttribute('aria-pressed', x === b));
  loadProducts(true);
});

/* ---------- Products ---------- */
const card = p => `
  <li><article>
    <div class="pic"><img src="${esc(p.thumbnail)}" alt="${esc(p.title)}" width="300" height="300" loading="lazy"></div>
    <div class="row"><h3><a href="product.html?id=${p.id}">${esc(p.title)}</a></h3><span class="price">$${p.price.toFixed(2)}</span></div>
    <p class="sub"><span>${esc((p.brand || p.category).replace(/-/g, ' '))}</span><span>${p.rating.toFixed(1)} / 5</span></p>
  </article></li>`;

async function loadProducts(reset) {
  const id = ++req;
  if (reset) { skip = 0; $('grid').innerHTML = ''; $('count').textContent = ''; }
  $('more').hidden = true;
  $('msg').innerHTML = LOADER;
  try {
    const base = cat ? `${API}/category/${cat}` : API;
    const d = await getJSON(`${base}?limit=${LIMIT}&skip=${skip}`);
    if (id !== req) return;                 // user clicked another category meanwhile
    $('grid').insertAdjacentHTML('beforeend', d.products.map(card).join(''));
    skip += d.products.length;
    $('count').textContent = `Showing ${skip} of ${d.total} items`;
    $('msg').textContent = d.total ? '' : 'No products in this category.';
    $('more').hidden = skip >= d.total;
  } catch {
    if (id === req) showError('Could not load products.', () => loadProducts(reset));
  }
}

$('more').onclick = () => loadProducts(false);

loadCategories();
loadProducts(true);
</script>
</body>
</html>
